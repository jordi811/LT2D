<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>線形変換シミュレーター（メッシュ・固有値・固有ベクトル）</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 10px;
      color: #333;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }
    .canvas-card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    canvas {
      border: 1px solid #ccc;
      background-color: #ffffff;
      display: block;
    }
    .control-card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 320px;
    }
    
    /* 2x2 MatrixForm スタイル */
    .matrix-title {
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .matrix-brackets {
      display: inline-flex;
      border-left: 2px solid #333;
      border-right: 2px solid #333;
      border-radius: 6px;
      padding: 2px 8px;
      margin: 0 6px;
      align-items: center;
    }
    .matrix-grid-display {
      display: grid;
      grid-template-columns: auto auto;
      gap: 4px 12px;
      text-align: center;
      font-family: serif;
      font-size: 20px;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      border-left: 4px solid #4a90e2;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
    }
    .slider-group label {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .slider-group input {
      width: 100%;
    }
    .info-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 6px;
      font-size: 15px;
    }
    .det-positive { background-color: #e6f4ea; color: #137333; }
    .det-zero     { background-color: #feefc3; color: #b06000; }
    .det-negative { background-color: #fce8e6; color: #c5221f; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    
    .preset-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }
    .preset-buttons button {
      padding: 8px 12px;
      border: none;
      background-color: #4a90e2;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .preset-buttons button:hover {
      background-color: #357abd;
    }
  </style>
</head>
<body>

  <h1>線形変換シミュレーター</h1>
  <p style="color: #666; margin-top:0;">空間メッシュ・楕円・行列式・固有値・固有ベクトル（シアン矢印）を観察しよう</p>

  <div class="container">
    <div class="canvas-card">
      <canvas id="canvas" width="500" height="500"></canvas>
    </div>

    <div class="control-card">
      <!-- 縦書き MatrixForm 表示 -->
      <div class="matrix-title">
        表現行列 <i>A</i> = 
        <div class="matrix-brackets">
          <div class="matrix-grid-display">
            <span id="disp-a">1</span><span id="disp-b">0</span>
            <span id="disp-c">0</span><span id="disp-d">1</span>
          </div>
        </div>
      </div>
      
      <div class="matrix-grid">
        <div class="slider-group">
          <label>a = <span id="val-a">1.0</span></label>
          <input type="range" id="slider-a" min="-3" max="3" step="0.1" value="1">
        </div>
        <div class="slider-group">
          <label>b = <span id="val-b">0.0</span></label>
          <input type="range" id="slider-b" min="-3" max="3" step="0.1" value="0">
        </div>
        <div class="slider-group">
          <label>c = <span id="val-c">0.0</span></label>
          <input type="range" id="slider-c" min="-3" max="3" step="0.1" value="0">
        </div>
        <div class="slider-group">
          <label>d = <span id="val-d">1.0</span></label>
          <input type="range" id="slider-d" min="-3" max="3" step="0.1" value="1">
        </div>
      </div>

      <!-- 情報表示ボックス -->
      <div id="info-box" class="info-box det-positive">
        <div class="info-row">
          <span>行列式 det(A):</span>
          <span id="val-det">1.00</span>
        </div>
        <div class="info-row">
          <span>固有値 λ₁, λ₂:</span>
          <span id="val-eigen">1.00, 1.00</span>
        </div>
        <div id="status-text" style="font-size: 13px; font-weight: normal; margin-top: 8px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 6px;">
          状態: 向きを保持（通常）
        </div>
      </div>

      <h4>プリセット変換</h4>
      <div class="preset-buttons">
        <button onclick="setMatrix(1, 0, 0, 1)">恒等変換 (単位行列)</button>
        <button onclick="setMatrix(1, 1, 0, 1)">シアー (せん断)</button>
        <button onclick="setMatrix(0.7, -0.7, 0.7, 0.7)">45度回転</button>
        <button onclick="setMatrix(1, 1, 1, 1)">潰れ (det=0)</button>
        <button onclick="setMatrix(-1, 0, 0, 1)">y軸で折り返し (裏返し)</button>
        <button onclick="setMatrix(0, 1, 1, 0)">y=xで鏡映 (裏返し)</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const sliders = {
      a: document.getElementById('slider-a'),
      b: document.getElementById('slider-b'),
      c: document.getElementById('slider-c'),
      d: document.getElementById('slider-d')
    };
    const values = {
      a: document.getElementById('val-a'),
      b: document.getElementById('val-b'),
      c: document.getElementById('val-c'),
      d: document.getElementById('val-d'),
      det: document.getElementById('val-det'),
      eigen: document.getElementById('val-eigen')
    };
    const disp = {
      a: document.getElementById('disp-a'),
      b: document.getElementById('disp-b'),
      c: document.getElementById('disp-c'),
      d: document.getElementById('disp-d')
    };
    const infoBox = document.getElementById('info-box');
    const statusText = document.getElementById('status-text');

    const SCALE = 50;
    const CENTER_X = canvas.width / 2;
    const CENTER_Y = canvas.height / 2;

    function toScreenX(x) { return CENTER_X + x * SCALE; }
    function toScreenY(y) { return CENTER_Y - y * SCALE; }

    function draw() {
      const a = parseFloat(sliders.a.value);
      const b = parseFloat(sliders.b.value);
      const c = parseFloat(sliders.c.value);
      const d = parseFloat(sliders.d.value);

      values.a.textContent = a.toFixed(1);
      values.b.textContent = b.toFixed(1);
      values.c.textContent = c.toFixed(1);
      values.d.textContent = d.toFixed(1);

      disp.a.textContent = a.toFixed(1);
      disp.b.textContent = b.toFixed(1);
      disp.c.textContent = c.toFixed(1);
      disp.d.textContent = d.toFixed(1);

      const det = a * d - b * c;
      values.det.textContent = det.toFixed(2);

      // --- 固有値と固有ベクトルの計算 ---
      const tr = a + d;
      const discriminant = tr * tr - 4 * det;
      let eigenStr = "";
      let eigenVectors = []; // 描画用固有ベクトル格納配列

      if (discriminant >= 0) {
        const l1 = (tr + Math.sqrt(discriminant)) / 2;
        const l2 = (tr - Math.sqrt(discriminant)) / 2;
        
        if (Math.abs(l1 - l2) < 0.001) {
          eigenStr = `${l1.toFixed(2)} (重解)`;
        } else {
          eigenStr = `${l1.toFixed(2)}, ${l2.toFixed(2)}`;
        }

        // 固有ベクトルの計算 v1, v2
        [l1, l2].forEach(lambda => {
          let vx = 0, vy = 0;
          if (Math.abs(b) > 0.0001) {
            vx = 1; vy = (lambda - a) / b;
          } else if (Math.abs(c) > 0.0001) {
            vx = (lambda - d) / c; vy = 1;
          } else {
            // 対角行列の場合
            if (Math.abs(lambda - a) < 0.0001) { vx = 1; vy = 0; }
            else { vx = 0; vy = 1; }
          }
          // 変換後の固有ベクトル (A * v = lambda * v)
          // 変換後の行き先の方向（大きさ2に正規化）
          const tx = a * vx + b * vy;
          const ty = c * vx + d * vy;
          const tlen = Math.hypot(tx, ty);

          if (tlen > 0.0001) {
            // 長さ2に設定
            eigenVectors.push({ x: (tx / tlen) * 2, y: (ty / tlen) * 2 });
          }
        });

      } else {
        const real = (tr / 2).toFixed(2);
        const imag = (Math.sqrt(-discriminant) / 2).toFixed(2);
        eigenStr = `${real} ± ${imag}i`;
      }
      values.eigen.textContent = eigenStr;

      // ステータス表示の更新
      if (Math.abs(det) < 0.05) {
        infoBox.className = "info-box det-zero";
        statusText.textContent = "状態: 空間全体が直線上にペシャンコに潰れた (det = 0)";
      } else if (det < 0) {
        infoBox.className = "info-box det-negative";
        statusText.textContent = "状態: 空間全体が【裏返し】になった (鏡文字)";
      } else {
        infoBox.className = "info-box det-positive";
        statusText.textContent = "状態: 向きを保持 (回転・伸縮・歪み)";
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- 1. 背景の薄い固定座標軸 ---
      ctx.strokeStyle = '#f0f0f0';
      ctx.lineWidth = 1;
      for (let i = -6; i <= 6; i++) {
        ctx.beginPath(); ctx.moveTo(toScreenX(i), 0); ctx.lineTo(toScreenX(i), canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, toScreenY(i)); ctx.lineTo(canvas.width, toScreenY(i)); ctx.stroke();
      }

      // --- 2. 変換後の空間メッシュ（全体に広がる格子線） ---
      ctx.lineWidth = 1;
      ctx.strokeStyle = (det < 0) ? 'rgba(217, 48, 37, 0.35)' : 'rgba(26, 115, 232, 0.35)';

      const RANGE = 6;
      for (let i = -RANGE; i <= RANGE; i++) {
        const startX = a * i + b * (-RANGE);
        const startY = c * i + d * (-RANGE);
        const endX   = a * i + b * RANGE;
        const endY   = c * i + d * RANGE;
        ctx.beginPath();
        ctx.moveTo(toScreenX(startX), toScreenY(startY));
        ctx.lineTo(toScreenX(endX), toScreenY(endY));
        ctx.stroke();
      }
      for (let j = -RANGE; j <= RANGE; j++) {
        const startX = a * (-RANGE) + b * j;
        const startY = c * (-RANGE) + d * j;
        const endX   = a * RANGE + b * j;
        const endY   = c * RANGE + d * j;
        ctx.beginPath();
        ctx.moveTo(toScreenX(startX), toScreenY(startY));
        ctx.lineTo(toScreenX(endX), toScreenY(endY));
        ctx.stroke();
      }

      // --- 3. 単位正方形 (コマ) ---
      const p0 = {x: 0, y: 0};
      const p1 = {x: a, y: c};
      const p2 = {x: a + b, y: c + d};
      const p3 = {x: b, y: d};

      ctx.beginPath();
      ctx.moveTo(toScreenX(p0.x), toScreenY(p0.y));
      ctx.lineTo(toScreenX(p1.x), toScreenY(p1.y));
      ctx.lineTo(toScreenX(p2.x), toScreenY(p2.y));
      ctx.lineTo(toScreenX(p3.x), toScreenY(p3.y));
      ctx.closePath();

      if (det < 0) {
        ctx.fillStyle = 'rgba(234, 67, 53, 0.25)';
      } else if (Math.abs(det) < 0.05) {
        ctx.fillStyle = 'rgba(251, 188, 4, 0.4)';
      } else {
        ctx.fillStyle = 'rgba(66, 133, 244, 0.25)';
      }
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = (det < 0) ? '#d93025' : '#1a73e8';
      ctx.stroke();

      // --- 4. 変換前の「単位円」（点線で固定表示） ---
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, SCALE, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // --- 5. 変換後の「楕円」（実線で描画） ---
      ctx.strokeStyle = (det < 0) ? '#e37400' : '#8e24aa';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      const STEPS = 100;
      for (let i = 0; i <= STEPS; i++) {
        const theta = (i / STEPS) * Math.PI * 2;
        const ux = Math.cos(theta);
        const uy = Math.sin(theta);
        const tx = a * ux + b * uy;
        const ty = c * ux + d * uy;

        const sx = toScreenX(tx);
        const sy = toScreenY(ty);
        if (i === 0) {
          ctx.moveTo(sx, sy);
        } else {
          ctx.lineTo(sx, sy);
        }
      }
      ctx.closePath();
      ctx.stroke();

      // --- 6. 「あ」の文字を描画 ---
      ctx.save();
      ctx.transform(a, -c, -b, d, CENTER_X, CENTER_Y);
      ctx.font = 'bold 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = (det < 0) ? '#b31412' : '#155724';
      ctx.fillText('あ', 0.5 * SCALE, -0.5 * SCALE);
      ctx.restore();

      // --- 7. 固有ベクトルの描画（大きさ:2, 太さ:1.5 [赤緑の半分], 色:cyan） ---
      eigenVectors.forEach(vec => {
        drawArrow(p0, vec, '#00bcd4', 1.5, 7);
      });

      // --- 8. 基底ベクトル（太さ:3 [標準]） ---
      drawArrow(p0, p1, '#e53935', 3, 10); // e1 (赤)
      drawArrow(p0, p3, '#43a047', 3, 10); // e2 (緑)
    }

    function drawArrow(from, to, color, lineWidth = 3, headlen = 10) {
      const fromX = toScreenX(from.x);
      const fromY = toScreenY(from.y);
      const toX = toScreenX(to.x);
      const toY = toScreenY(to.y);
      const angle = Math.atan2(toY - fromY, toX - fromX);

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = lineWidth;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function setMatrix(a, b, c, d) {
      sliders.a.value = a;
      sliders.b.value = b;
      sliders.c.value = c;
      sliders.d.value = d;
      draw();
    }

    Object.values(sliders).forEach(slider => {
      slider.addEventListener('input', draw);
    });

    draw();
  </script>
</body>
</html>
